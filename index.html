<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Aplikasi Panduan Tajwid</title>

    <!-- Memuat Tailwind CSS untuk Desain Antarmuka -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap");

      /* Mengimpor Font LPMQ Isep Misbah (Standar Kemenag RI) */
      @font-face {
        font-family: "LPMQ Isep Misbah";
        src: url("https://cdn.jsdelivr.net/gh/sutanlab/font/LPMQ_IsepMisbah.woff2")
          format("woff2");
        font-display: swap;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc; /* slate-50 */
        /* Dukungan area aman untuk layar HP modern (Notch) */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .font-arabic {
        font-family: "LPMQ Isep Misbah", "Amiri Quran", serif;
        line-height: 2.2; /* Jarak antar baris ekstra untuk harakat Arab */
      }

      /* Menyembunyikan scrollbar untuk tampilan yang lebih bersih */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="text-slate-800 antialiased overflow-hidden select-none flex justify-center h-screen w-screen bg-slate-900"
  >
    <!-- Container Utama: Menyerupai Layar Smartphone -->
    <div
      id="app"
      class="h-full w-full max-w-md bg-slate-50 flex flex-col relative shadow-2xl border-x border-slate-800 overflow-hidden"
    >
      <!-- Header (Bilah Atas) -->
      <header
        class="bg-emerald-600 text-white h-16 flex items-center px-4 shadow-md z-20 relative shrink-0"
      >
        <!-- Tombol Kembali -->
        <button
          id="backBtn"
          onclick="goBack()"
          class="absolute left-3 p-2 rounded-full hover:bg-emerald-700 active:bg-emerald-800 transition-all opacity-0 pointer-events-none transform -translate-x-2"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </button>

        <!-- Judul Aplikasi / Halaman -->
        <h1
          id="appTitle"
          class="w-full text-center text-lg font-bold tracking-wide transition-all duration-300"
        >
          Panduan Tajwid
        </h1>
      </header>

      <!-- Area Konten Utama -->
      <main
        id="mainContent"
        class="flex-1 overflow-y-auto hide-scrollbar p-5 pb-24 relative bg-slate-50 z-10"
      >
        <!-- Konten akan dimuat di sini secara dinamis -->
      </main>

      <!-- Bottom Navigation -->
      <nav
        class="bg-white border-t border-slate-200 h-16 absolute bottom-0 w-full z-30 flex justify-around items-center px-2 shadow-[0_-4px_15px_-5px_rgba(0,0,0,0.05)]"
      >
        <button
          onclick="switchTab('tajwid')"
          id="tabTajwid"
          class="flex flex-col items-center justify-center w-full h-full text-emerald-600 transition-colors"
        >
          <svg
            class="w-6 h-6 mb-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"
            ></path>
          </svg>
          <span class="text-xs font-semibold">Tajwid</span>
        </button>
        <button
          onclick="switchTab('quran')"
          id="tabQuran"
          class="flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 transition-colors"
        >
          <svg
            class="w-6 h-6 mb-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"
            ></path>
          </svg>
          <span class="text-xs font-semibold">Al-Qur'an</span>
        </button>
      </nav>

      <!-- Ornamen Latar Belakang -->
      <div
        class="fixed bottom-0 w-full max-w-md h-32 bg-gradient-to-t from-emerald-100/50 to-transparent pointer-events-none z-0"
      ></div>

      <!-- MODAL INFO HURUF HIJAIYAH (MAKHRAJ) -->
      <div
        id="hijaiyahModal"
        class="absolute inset-0 z-50 flex items-center justify-center p-5 opacity-0 pointer-events-none transition-all duration-300"
      >
        <!-- Latar Gelap (Overlay) -->
        <div
          class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity"
          onclick="closeHijaiyahModal()"
        ></div>

        <!-- Konten Popup -->
        <div
          class="bg-white rounded-[2rem] p-6 w-full max-w-[90%] relative z-10 transform translate-y-8 scale-95 transition-all duration-300 shadow-2xl flex flex-col items-center text-center border border-slate-100"
        >
          <button
            onclick="closeHijaiyahModal()"
            class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-slate-50 p-2 rounded-full transition-colors"
          >
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2.5"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </button>

          <div
            class="w-20 h-20 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-3 border-[4px] border-white shadow-sm mt-2 relative"
          >
            <span
              id="modalLetterArab"
              class="text-5xl font-arabic mt-2 leading-none"
            ></span>
          </div>
          <div
            id="modalLetterLatin"
            class="text-sm font-bold text-slate-800 mb-5 bg-emerald-100 px-4 py-1.5 rounded-full text-emerald-700 tracking-wide uppercase shadow-sm"
          ></div>

          <div
            class="w-full bg-slate-50 rounded-2xl p-4 mb-2 text-left border border-slate-100 relative overflow-hidden"
          >
            <div class="absolute -right-4 -bottom-4 opacity-[0.03]">
              <svg class="w-24 h-24" fill="currentColor" viewBox="0 0 24 24">
                <path
                  d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"
                />
              </svg>
            </div>
            <h4
              class="font-semibold text-slate-700 text-xs w-full text-left mb-2 flex items-center gap-1.5 uppercase tracking-wide"
            >
              <svg
                class="w-4 h-4 text-emerald-500"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                ></path>
              </svg>
              Makharijul Huruf
            </h4>
            <p
              id="modalLetterMakhraj"
              class="text-sm text-slate-600 leading-relaxed relative z-10"
            ></p>
          </div>

          <button
            onclick="playCurrentModalAudio()"
            class="mt-4 w-full flex items-center justify-center gap-2 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white py-3.5 rounded-xl font-semibold transition-all shadow-[0_4px_15px_-3px_rgba(16,185,129,0.4)]"
          >
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            Putar Audio Lagi
          </button>
        </div>
      </div>
    </div>

      // VARIABEL STATE DAN ELEMEN UI
      const mainContent = document.getElementById("mainContent");
      const appTitle = document.getElementById("appTitle");
      const backBtn = document.getElementById("backBtn");

      let navigationStack = [{ view: "home", dataId: null }];
      let currentTab = "tajwid";
      let quranSurahList = [];

      // State untuk Audio Al-Qur'an (Background Play)
      let currentSurahAyatData = [];
      let isContinuousPlay = false;
      let activeAyatIndex = -1;
      window.currentQuranAudio = null; // Menyimpan instans audio secara global

      function applyTajwidColoring(teks) {
        // Qalqalah (Biru)
        teks = teks.replace(
          /([قطبجد]\u0652)/g,
          '<span class="text-blue-600" title="Qalqalah">$1</span>',
        );
        // Mad Wajib/Jaiz (Merah)
        teks = teks.replace(
          /([^\s\u0600-\u061F\u064B-\u0652\u06D6-\u06ED]+[\u064B-\u065F]*\u06E4)/g,
          '<span class="text-red-600" title="Mad">$1</span>',
        );
        // Ghunnah & Idgham
        teks = teks.replace(
          /([من][\u064B-\u0650]*\u0651[\u064B-\u0650]*)/g,
          '<span class="text-pink-600" title="Ghunnah">$1</span>',
        );
        teks = teks.replace(
          /([ن\u064B\u064C\u064D][\u064B-\u0652]*\u06E2)/g,
          '<span class="text-pink-600" title="Iqlab">$1</span>',
        );
        const tanwinNun = "([ن\u064B\u064C\u064D]\u0652?)";
        const idghamBi = "([ينمو])";
        teks = teks.replace(
          new RegExp(`${tanwinNun}(\\s*)${idghamBi}`, "g"),
          '<span class="text-pink-600" title="Idgham Bighunnah">$1$2$3</span>',
        );
        // Ikhfa (Hijau)
        const ikhfaLetters = "([تثجذزسشصضطظفقك])";
        teks = teks.replace(
          new RegExp(`${tanwinNun}(\\s*)${ikhfaLetters}`, "g"),
          '<span class="text-emerald-600" title="Ikhfa">$1$2$3</span>',
        );
        const mimSukun = "(م\u0652)";
        const ikhfaSyafawiLtr = "(ب)";
        teks = teks.replace(
          new RegExp(`${mimSukun}(\\s*)${ikhfaSyafawiLtr}`, "g"),
          '<span class="text-emerald-600" title="Ikhfa Syafawi">$1$2$3</span>',
        );
        return teks;
      }

      function showToast(message) {
        document.querySelectorAll(".toast-msg").forEach((t) => t.remove());
        const toast = document.createElement("div");
        toast.className =
          "toast-msg absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl text-sm transition-all duration-300 opacity-0 translate-y-4 z-50 whitespace-nowrap text-center max-w-[90%]";
        toast.textContent = message;
        document.getElementById("app").appendChild(toast);
        setTimeout(() => {
          toast.classList.remove("opacity-0", "translate-y-4");
          toast.classList.add("opacity-100", "translate-y-0");
        }, 10);
        setTimeout(() => {
          toast.classList.remove("opacity-100", "translate-y-0");
          toast.classList.add("opacity-0", "translate-y-4");
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      function switchTab(tab) {
        currentTab = tab;
        navigationStack = [
          { view: tab === "tajwid" ? "home" : "quran_list", dataId: null },
        ];
        document.getElementById("tabTajwid").className =
          tab === "tajwid"
            ? "flex flex-col items-center justify-center w-full h-full text-emerald-600 transition-colors"
            : "flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 transition-colors";
        document.getElementById("tabQuran").className =
          tab === "quran"
            ? "flex flex-col items-center justify-center w-full h-full text-emerald-600 transition-colors"
            : "flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 transition-colors";
        renderCurrentState();
      }

      function navigateTo(view, dataId = null) {
        if (view === "home" || view === "quran_list") {
          navigationStack = [{ view: view, dataId: null }];
        } else {
          navigationStack.push({ view: view, dataId: dataId });
        }
        renderCurrentState();
      }

      function goBack() {
        if (navigationStack.length > 1) {
          navigationStack.pop();
          renderCurrentState();
        }
      }

      function renderCurrentState() {
        const currentState = navigationStack[navigationStack.length - 1];

        // Hentikan suara Text-To-Speech jika ada
        stopAudio();

        // PAUSE: Kami membiarkan Murottal tetap jalan di background, tidak dimatikan saat pindah layar (Fitur Baru)

        mainContent.classList.add("opacity-0");
        setTimeout(() => {
          if (navigationStack.length > 1) {
            backBtn.classList.remove(
              "opacity-0",
              "pointer-events-none",
              "-translate-x-2",
            );
            backBtn.classList.add("opacity-100", "translate-x-0");
          } else {
            backBtn.classList.add(
              "opacity-0",
              "pointer-events-none",
              "-translate-x-2",
            );
            backBtn.classList.remove("opacity-100", "translate-x-0");
          }

          if (currentState.view === "home") renderHome();
          else if (currentState.view === "tajwid_categories")
            renderTajwidCategories();
          else if (currentState.view === "category")
            renderCategory(currentState.dataId);
          else if (currentState.view === "material")
            renderMaterial(currentState.dataId);
          else if (currentState.view === "quran_list") renderQuranList();
          else if (currentState.view === "quran_surah")
            renderQuranSurah(currentState.dataId);

          mainContent.scrollTop = 0;
          mainContent.classList.remove("opacity-0");
          mainContent.classList.add("transition-opacity", "duration-300");

          // Jika kita membuka surah yang sedang diputar, pastikan UI tombolnya sinkron
          if (currentState.view === "quran_surah" && isContinuousPlay) {
            updateContinuousBtnUI();
          }
        }, 150);
      }

      async function fetchQuranList() {
        try {
          const response = await fetch("https://equran.id/api/v2/surat");
          const data = await response.json();
          return data.data;
        } catch (error) {
          showToast("Gagal memuat data Al-Qur'an.");
          return null;
        }
      }

      async function fetchSurahDetail(nomor) {
        try {
          const response = await fetch(
            `https://equran.id/api/v2/surat/${nomor}`,
          );
          const data = await response.json();
          return data.data;
        } catch (error) {
          showToast("Gagal memuat surah.");
          return null;
        }
      }

        appTitle.textContent = "Al-Qur'an 30 Juz";
        mainContent.innerHTML = `<div class="flex flex-col items-center justify-center h-40"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-600 mb-3"></div><p class="text-slate-500 text-sm">Memuat Daftar Surah...</p></div>`;

        if (quranSurahList.length === 0) {
          const surahs = await fetchQuranList();
          if (surahs) quranSurahList = surahs;
          else {
            mainContent.innerHTML = `<div class="text-center text-red-500 p-5 bg-red-50 rounded-xl">Koneksi terputus.</div>`;

        let html = '<div class="space-y-3 pb-8 animate-fade-in-up">';

          html += `

                <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-sm border border-emerald-100 shrink-0 relative overflow-hidden">
                    <span class="relative z-10">${surah.nomor}</span>
                </div>
                <div class="ml-4 flex-1">
                    <h3 class="font-bold text-slate-800 text-base">${surah.namaLatin}</h3>
                    <p class="text-xs text-slate-500 mt-0.5">${surah.tempatTurun} • ${surah.jumlahAyat} Ayat</p>
                </div>
                <div class="text-2xl font-arabic text-emerald-800">${surah.nama}</div>
            </div>`;
        });
        html += "</div>";
        mainContent.innerHTML = html;
      }

      async function renderQuranSurah(nomor) {
        appTitle.textContent = "Memuat Surah...";
        mainContent.innerHTML = `<div class="flex flex-col items-center justify-center h-64"><div class="animate-spin rounded-full h-10 w-10 border-b-2 border-emerald-600 mb-3"></div><p class="text-slate-500 text-sm">Mengunduh Ayat...</p></div>`;

        const detail = await fetchSurahDetail(nomor);
        if (!detail) return;

        // Kita biarkan audio lama berjalan jika itu surah yang sama.
        // Jika pindah surah baru, otomatis hentikan audio lama
        if (window.currentQuranAudio && window.currentQuranSurahId !== nomor) {
          window.currentQuranAudio.pause();
          isContinuousPlay = false;
          activeAyatIndex = -1;
        }

        window.currentQuranSurahId = nomor; // Simpan penanda surah yang sedang diputar
        currentSurahAyatData = detail.ayat;
        appTitle.textContent = detail.namaLatin;

        let html = `
            <div class="animate-fade-in-up">
                <div class="bg-gradient-to-br from-emerald-600 to-teal-700 p-6 rounded-3xl text-white mb-6 shadow-lg text-center relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-white opacity-10 rounded-full"></div>
                    <h2 class="text-3xl font-arabic mb-2 drop-shadow-md mt-2">${detail.nama}</h2>
                    <h3 class="text-xl font-bold mb-1">${detail.namaLatin}</h3>
                    <p class="text-emerald-100 text-sm opacity-90 mb-4">${detail.arti} • ${detail.jumlahAyat} Ayat</p>
                    
                    <button id="btnPlaySurah" onclick="toggleContinuousPlay()" class="mx-auto flex items-center justify-center gap-2 bg-white/20 hover:bg-white/30 active:scale-95 text-white py-2.5 px-6 rounded-full font-semibold text-sm backdrop-blur-sm transition-all border border-white/30">
                        <svg id="iconPlaySurah" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        <span id="textPlaySurah">Putar Surah</span>
                    </button>
                </div>`;

        if (nomor !== 9 && nomor !== 1) {
          html += `<div class="bg-white p-5 rounded-3xl shadow-sm border border-slate-100 mb-6 text-center"><p class="text-[2rem] font-arabic text-slate-800 leading-loose">بِسْمِ اللّٰهِ الرَّحْمٰنِ الرَّحِيْمِ</p></div>`;
        }

        html += `
            <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-x-4 gap-y-2 justify-center text-xs font-semibold text-slate-600">
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-red-600"></span> Mad (Panjang)</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-pink-600"></span> Dengung/Idgham</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-600"></span> Ikhfa (Samar)</span>
                <span class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-blue-600"></span> Qalqalah</span>
            </div>
            <div class="space-y-6 pb-10">`;

        detail.ayat.forEach((ayat, index) => {
          const coloredTeksArab = applyTajwidColoring(ayat.teksArab);
          // Highlight jika kebetulan ini adalah ayat yang sedang diputar di background
          const isActive = isContinuousPlay && activeAyatIndex === index;
          const bgClass = isActive
            ? "bg-emerald-50 border-emerald-200"
            : "bg-white border-slate-100";
          const btnClass = isActive
            ? "bg-emerald-500 text-white animate-pulse border-transparent"
            : "bg-emerald-50 text-emerald-500 border-emerald-100";
          const iconPath = isActive
            ? "M6 19h4V5H6v14zm8-14v14h4V5h-4z"
            : "M8 5v14l11-7z";

          html += `
                <div id="ayat-container-${index}" class="${bgClass} p-5 rounded-3xl shadow-[0_2px_15px_-5px_rgba(0,0,0,0.05)] border relative transition-colors duration-500">
                    <div class="flex justify-between items-start mb-5">
                        <div class="w-9 h-9 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center font-semibold text-xs border border-emerald-100 shrink-0">
                            ${ayat.nomorAyat}
                        </div>
                        <button id="btn-audio-ayat-${index}" onclick="playQuranAudio(${index}, false)" class="quran-audio-btn w-10 h-10 flex items-center justify-center rounded-full hover:bg-emerald-100 active:scale-90 transition-all shadow-sm border shrink-0 ${btnClass}">
                            <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="${iconPath}"/></svg>
                        </button>
                    </div>
                    <p class="text-[2.2rem] font-arabic text-slate-800 leading-[4rem] text-right mb-6" dir="rtl">
                        ${coloredTeksArab}
                    </p>
                    <div class="border-t border-slate-100 pt-4">
                        <p class="text-sm font-semibold text-emerald-700 mb-2 leading-relaxed">${ayat.teksLatin}</p>
                        <p class="text-sm text-slate-600 leading-relaxed text-justify">${ayat.teksIndonesia}</p>
                    </div>
                </div>`;
        });

        html += `</div></div>`;
        mainContent.innerHTML = html;

        // Sinkronkan UI tombol Murottal jika audio masih nyala di background
        if (isContinuousPlay) updateContinuousBtnUI();
      }

      function toggleContinuousPlay() {
        if (
          isContinuousPlay &&
          window.currentQuranAudio &&
          !window.currentQuranAudio.paused
        ) {
          window.currentQuranAudio.pause();
          isContinuousPlay = false;
          updateContinuousBtnUI();
          resetQuranAudioButtons();
        } else if (
          !isContinuousPlay &&
          window.currentQuranAudio &&
          !window.currentQuranAudio.paused
        ) {
          isContinuousPlay = true;
          updateContinuousBtnUI();
          showToast("Mode putar berurutan diaktifkan.");
        } else {
          isContinuousPlay = true;
          const startIndex = activeAyatIndex !== -1 ? activeAyatIndex : 0;
          playQuranAudio(startIndex, true);
        }
      }

      function updateContinuousBtnUI() {
        const btn = document.getElementById("btnPlaySurah");
        const icon = document.getElementById("iconPlaySurah");
        const text = document.getElementById("textPlaySurah");
        if (!btn) return; // Mencegah error jika dipanggil saat UI sedang dirender ulang

        if (isContinuousPlay) {
          icon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
          text.textContent = "Hentikan";
          btn.classList.add(
            "bg-white/40",
            "animate-pulse",
            "ring-2",
            "ring-white/50",
          );
        } else {
          icon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
          text.textContent = "Putar Surah";
          btn.classList.remove(
            "bg-white/40",
            "animate-pulse",
            "ring-2",
            "ring-white/50",
          );
        }
      }

      function resetQuranAudioButtons() {
        const playIcon = `<path d="M8 5v14l11-7z"/>`;
        document.querySelectorAll(".quran-audio-btn").forEach((btn) => {
          btn.querySelector("svg path").setAttribute("d", playIcon);
          btn.classList.remove(
            "bg-emerald-500",
            "text-white",
            "animate-pulse",
            "border-transparent",
          );
          btn.classList.add(
            "bg-emerald-50",
            "text-emerald-500",
            "border-emerald-100",
          );
        });
        document
          .querySelectorAll('[id^="ayat-container-"]')
          .forEach((container) => {
            container.classList.remove("bg-emerald-50", "border-emerald-200");
            container.classList.add("bg-white", "border-slate-100");
          });
      }

      function playQuranAudio(index, fromContinuous = false) {
        if (!currentSurahAyatData || currentSurahAyatData.length === 0) return;

        if (!fromContinuous) {
          isContinuousPlay = false;
          updateContinuousBtnUI();
        }

        const ayatData = currentSurahAyatData[index];
        const url = ayatData.audio["05"];
        const btnElement = document.getElementById(`btn-audio-ayat-${index}`);
        const containerElement = document.getElementById(
          `ayat-container-${index}`,
        );

        stopAudio(); // Hentikan TTS Tajwid jika ada

        // Pause Manual jika menekan tombol yang sedang berjalan
        if (
          activeAyatIndex === index &&
          window.currentQuranAudio &&
          !window.currentQuranAudio.paused
        ) {
          window.currentQuranAudio.pause();
          isContinuousPlay = false;
          updateContinuousBtnUI();
          resetQuranAudioButtons();
          return;
        }

        if (window.currentQuranAudio) {
          window.currentQuranAudio.pause();
        }
        resetQuranAudioButtons();
        activeAyatIndex = index;

        // Buat atau timpa objek audio global
        window.currentQuranAudio = new Audio(url);

        // Memulai audio dan mengatur MediaSession agar berjalan di Background (Lock Screen)
        window.currentQuranAudio
          .play()
          .then(() => {
            if ("mediaSession" in navigator) {
              const suratName = document.getElementById("appTitle").textContent;
              navigator.mediaSession.metadata = new MediaMetadata({
                title: `Ayat ${ayatData.nomorAyat}`,
                artist: `${suratName} - Murottal`,
                album: "Aplikasi Panduan Tajwid",
                artwork: [
                  {
                    src: "https://placehold.co/512x512/10b981/ffffff?text=Quran",
                    sizes: "512x512",
                    type: "image/png",
                  },
                ],
              });

              // Binding kontrol HP agar bisa mengontrol web app
              navigator.mediaSession.setActionHandler("play", () => {
                window.currentQuranAudio.play();
              });
              navigator.mediaSession.setActionHandler("pause", () => {
                window.currentQuranAudio.pause();
                if (document.getElementById(`btn-audio-ayat-${index}`))
                  resetQuranAudioButtons();
              });
              // Jika sedang continuous, aktifkan fitur next track
              if (isContinuousPlay) {
                navigator.mediaSession.setActionHandler("nexttrack", () => {
                  playQuranAudio(index + 1, true);
                });
              }
            }
          })
          .catch((e) => {
            showToast(
              "Gagal memutar audio, pastikan Anda terhubung ke internet.",
            );
            isContinuousPlay = false;
            updateContinuousBtnUI();
            resetQuranAudioButtons();
          });

        // Update Visual (Hanya Jika Elemennya Sedang Tampil di Layar / Belum Ganti Tab)
        if (btnElement) {
          btnElement
            .querySelector("svg path")
            .setAttribute("d", "M6 19h4V5H6v14zm8-14v14h4V5h-4z"); // Ikon Pause
          btnElement.classList.remove(
            "bg-emerald-50",
            "text-emerald-500",
            "border-emerald-100",
          );
          btnElement.classList.add(
            "bg-emerald-500",
            "text-white",
            "animate-pulse",
            "border-transparent",
          );

          setTimeout(() => {
            btnElement.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 150);
        }

        if (containerElement) {
          containerElement.classList.remove("bg-white", "border-slate-100");
          containerElement.classList.add("bg-emerald-50", "border-emerald-200");
        }

        if (fromContinuous) updateContinuousBtnUI();

        // Putar ayat selanjutnya secara otomatis jika fitur dinyalakan
        window.currentQuranAudio.onended = () => {
          if (isContinuousPlay) {
            const nextIndex = index + 1;
            if (nextIndex < currentSurahAyatData.length) {
              playQuranAudio(nextIndex, true);
            } else {
              isContinuousPlay = false;
              updateContinuousBtnUI();
              resetQuranAudioButtons();
              activeAyatIndex = -1;
              showToast("Alhamdulillah, pembacaan surah telah selesai.");
            }
          } else {
            resetQuranAudioButtons();
            activeAyatIndex = -1;
          }
        };
      }

      function renderHome() {
        appTitle.textContent = "Panduan Tajwid";
        let html = `
            <div class="animate-fade-in-up mb-6">
                <div onclick="navigateTo('tajwid_categories')" class="bg-gradient-to-r from-emerald-600 to-teal-600 rounded-3xl p-5 text-white shadow-lg cursor-pointer active:scale-[0.98] transition-transform relative overflow-hidden group">
                    <div class="absolute -right-6 -top-6 w-24 h-24 bg-white opacity-10 rounded-full group-hover:scale-150 transition-transform duration-500"></div>
                    <div class="flex items-center justify-between relative z-10">
                        <div>
                            <h2 class="text-xl font-bold mb-1">Materi Tajwid</h2>
                            <p class="text-emerald-100 text-sm">Pelajari hukum-hukum bacaan Al-Qur'an</p>
                        </div>
                        <div class="bg-white/20 p-3 rounded-full backdrop-blur-sm">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="animate-fade-in-up">
                <div class="flex items-center justify-between mb-4 px-1">
                    <h2 class="font-bold text-slate-800 text-lg">Huruf Hijaiyah</h2>
                    <span class="text-[10px] text-emerald-700 bg-emerald-100 px-2 py-1 rounded-full font-bold flex items-center gap-1 uppercase tracking-wider">
                        Makhraj & Audio
                    </span>
                </div>
                <div class="grid grid-cols-4 gap-3 pb-6">`;

        const colors = [
          "text-red-500",
          "text-sky-500",
          "text-amber-500",
          "text-purple-500",
          "text-rose-500",
          "text-indigo-500",
          "text-teal-500",
          "text-orange-500",
          "text-fuchsia-500",
          "text-emerald-600",
        ];

        hijaiyahData.forEach((huruf, idx) => {
          const colorClass = colors[idx % colors.length];
          // Klik tombol akan memicu Detail Popup sekaligus Suara
          html += `
                <button id="hijaiyah-btn-${idx}" onclick="showHijaiyahDetail(${idx}, this)" class="flex flex-col items-center justify-center bg-white border border-slate-100 shadow-[0_2px_8px_-3px_rgba(0,0,0,0.08)] rounded-2xl aspect-square active:scale-90 transition-all duration-200 group relative overflow-hidden">
                    <span data-color="${colorClass}" class="text-4xl font-arabic leading-none ${colorClass} transition-colors">${huruf.arab}</span>
                </button>`;
        });

        html += `</div></div>`;
        mainContent.innerHTML = html;
      }

      function renderTajwidCategories() {
        appTitle.textContent = "Materi Tajwid";
        let html = '<div class="space-y-4 animate-fade-in-up">';
        tajwidData.forEach((cat, index) => {
          const animDelay = index * 50;
          html += `
            <div onclick="navigateTo('category', '${cat.id}')" style="animation-delay: ${animDelay}ms;" class="bg-white p-5 rounded-2xl shadow-[0_2px_10px_-3px_rgba(6,81,237,0.1)] border border-slate-100 cursor-pointer active:scale-[0.98] transition-transform flex items-center justify-between group fill-mode-both">
                <div class="flex-1 pr-4">
                    <div class="flex items-center gap-3 mb-1">
                        <div class="bg-emerald-100 p-2 rounded-lg text-emerald-600">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                        </div>
                        <h2 class="text-lg font-bold text-slate-800">${cat.nama}</h2>
                    </div>
                    <p class="text-sm text-slate-500 mt-2 line-clamp-2 leading-relaxed">${cat.deskripsi}</p>
                </div>
            </div>`;
        });
        html += "</div>";
        mainContent.innerHTML = html;
      }

      function renderCategory(catId) {
        const category = tajwidData.find((c) => c.id === catId);
        if (!category) return;
        appTitle.textContent = category.nama;
        let html = `<p class="text-slate-600 mb-5 bg-white p-4 rounded-xl border border-slate-100 shadow-sm text-sm leading-relaxed">${category.deskripsi}</p><div class="space-y-3">`;
        category.materi.forEach((mat, index) => {
          const navParam = `${catId}|${mat.id}`;
          html += `
            <div onclick="navigateTo('material', '${navParam}')" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 cursor-pointer flex items-center justify-between active:bg-slate-50 transition-colors">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center font-bold text-sm border border-emerald-100">${index + 1}</div>
                    <h3 class="font-bold text-slate-800">${mat.nama}</h3>
                </div>
                <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </div>`;
        });
        html += "</div>";
        mainContent.innerHTML = html;
      }

      function renderMaterial(compoundId) {
        const [catId, matId] = compoundId.split("|");
        const category = tajwidData.find((c) => c.id === catId);
        const materi = category.materi.find((m) => m.id === matId);
        if (!materi) return;
        appTitle.textContent = materi.nama;
        const playIcon = `<svg class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;

        let html = `
            <div class="animate-fade-in-up">
                <div class="bg-emerald-50 text-emerald-900 p-5 rounded-2xl mb-6 text-sm leading-relaxed border border-emerald-100 shadow-sm relative overflow-hidden">
                    <div class="absolute -top-4 -right-4 w-16 h-16 bg-emerald-200/50 rounded-full"></div>
                    <h3 class="font-bold mb-2 flex items-center gap-2"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>Pengertian</h3>
                    ${materi.pengertian}
                </div>
                <h3 class="font-bold text-lg text-slate-800 mb-4 px-1">Contoh Bacaan</h3>
                <div class="space-y-5">`;

        materi.contoh.forEach((cth) => {
          const safeTeksArab = cth.teks_arab.replace(/'/g, "\\'");
          html += `
            <div class="bg-white rounded-3xl p-6 shadow-[0_4px_20px_-5px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col items-center relative overflow-hidden">
                <div class="absolute -top-12 -left-12 w-32 h-32 bg-slate-50 rounded-full pointer-events-none"></div>
                <div class="text-[2.7rem] font-arabic text-emerald-950 leading-relaxed mb-4 text-center mt-2 relative z-10 w-full" dir="rtl">${cth.teks_arab}</div>
                <div class="bg-slate-50 px-4 py-1.5 rounded-full text-emerald-700 font-semibold mb-3 text-sm border border-slate-200">${cth.teks_latin}</div>
                <div class="text-slate-500 text-sm text-center mb-6 px-2 line-clamp-3">${cth.penjelasan}</div>
                <button onclick="toggleAudio(this, '${safeTeksArab}')" class="audio-btn w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-[0_8px_15px_-3px_rgba(16,185,129,0.4)] active:scale-[0.85] active:bg-emerald-600 transition-all duration-200 z-10">
                    ${playIcon}
                </button>
            </div>`;
        });
        html += `</div></div>`;
        mainContent.innerHTML = html;
      }

      let currentAudioBtn = null;
      function toggleAudio(btnElement, textArab) {
        if (!("speechSynthesis" in window)) {
          showToast("Maaf, fitur suara tidak didukung.");
          return;
        }
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          resetAllPlayButtons();
          if (currentAudioBtn === btnElement) {
            currentAudioBtn = null;
            return;
          }
        }

        const utterance = new SpeechSynthesisUtterance(textArab);
        utterance.lang = "ar-SA";
        utterance.rate = 0.5;

        utterance.onstart = () => {
          resetAllPlayButtons();
          btnElement.innerHTML = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
          btnElement.classList.add("animate-pulse", "bg-emerald-600");
          btnElement.classList.remove("bg-emerald-500");
          currentAudioBtn = btnElement;
        };
        utterance.onend = () => {
          resetAllPlayButtons();
          currentAudioBtn = null;
        };
        utterance.onerror = (e) => {
          if (e.error !== "canceled")
            showToast("Suara Arab belum terpasang di perangkat ini.");
          resetAllPlayButtons();
          currentAudioBtn = null;
        };
        window.speechSynthesis.speak(utterance);
      }

      function stopAudio() {
        if ("speechSynthesis" in window && window.speechSynthesis.speaking)
          window.speechSynthesis.cancel();
        resetAllPlayButtons();
        currentAudioBtn = null;
      }

      function resetAllPlayButtons() {
        document.querySelectorAll(".audio-btn").forEach((btn) => {
          btn.innerHTML = `<svg class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
          btn.classList.remove("animate-pulse", "bg-emerald-600");
          btn.classList.add("bg-emerald-500");
        });
      }

      let currentActiveHijaiyahLatin = "";

      // Menampilkan popup detail penjelasan Makhraj Huruf
      function showHijaiyahDetail(idx, btnElement) {
        const huruf = hijaiyahData[idx];
        currentActiveHijaiyahLatin = huruf.latin;

        // Isi konten modal
        document.getElementById("modalLetterArab").textContent = huruf.arab;
        document.getElementById("modalLetterLatin").textContent = huruf.latin;
        document.getElementById("modalLetterMakhraj").textContent =
          huruf.makhraj;

        // Tampilkan Modal dengan animasi
        const modal = document.getElementById("hijaiyahModal");
        modal.classList.remove("opacity-0", "pointer-events-none");

        const modalBox = modal.querySelector(".bg-white");
        modalBox.classList.remove("translate-y-8", "scale-95");
        modalBox.classList.add("translate-y-0", "scale-100");

        // Otomatis putar audio
        playHijaiyahAudio(btnElement, huruf.latin);
      }

      // Menutup popup Makhraj
      function closeHijaiyahModal() {
        const modal = document.getElementById("hijaiyahModal");
        modal.classList.add("opacity-0", "pointer-events-none");

        const modalBox = modal.querySelector(".bg-white");
        modalBox.classList.add("translate-y-8", "scale-95");
        modalBox.classList.remove("translate-y-0", "scale-100");
      }

      // Memutar audio kembali dari dalam popup Makhraj
      function playCurrentModalAudio() {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(
          currentActiveHijaiyahLatin,
        );
        utterance.lang = "id-ID";
        utterance.rate = 0.8;
        window.speechSynthesis.speak(utterance);
      }

      function playHijaiyahAudio(btnElement, textToRead) {
        if (!("speechSynthesis" in window)) {
          showToast("Maaf, suara tidak didukung.");
          return;
        }
        window.speechSynthesis.cancel();

        document.querySelectorAll('[id^="hijaiyah-btn-"]').forEach((btn) => {
          btn.classList.remove(
            "bg-emerald-500",
            "border-transparent",
            "shadow-md",
            "scale-105",
          );
          btn.classList.add("bg-white", "border-slate-100");
          const span = btn.querySelector("span");
          if (span) {
            span.classList.remove("text-white");
            span.classList.add(span.getAttribute("data-color"));
          }
        });

        btnElement.classList.remove("bg-white", "border-slate-100");
        btnElement.classList.add(
          "bg-emerald-500",
          "border-transparent",
          "shadow-md",
          "scale-105",
        );
        const activeSpan = btnElement.querySelector("span");
        activeSpan.classList.remove(activeSpan.getAttribute("data-color"));
        activeSpan.classList.add("text-white");

        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = "id-ID";
        utterance.rate = 0.8;

        const resetBtnStyle = () => {
          btnElement.classList.add("bg-white", "border-slate-100");
          btnElement.classList.remove(
            "bg-emerald-500",
            "border-transparent",
            "shadow-md",
            "scale-105",
          );
          activeSpan.classList.add(activeSpan.getAttribute("data-color"));
          activeSpan.classList.remove("text-white");
        };

        utterance.onend = () => setTimeout(resetBtnStyle, 150);
        utterance.onerror = () => setTimeout(resetBtnStyle, 150);
        window.speechSynthesis.speak(utterance);
      }

      window.onload = () => {
        renderHome();
      };
    </script>
  </body>
</html>
