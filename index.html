<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Aplikasi Panduan Tajwid</title>

    <!-- Memuat Tailwind CSS untuk Desain Antarmuka -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Memuat Font Arab (Amiri Quran) dan Font Standar (Inter) -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap");

      /* Mengimpor Font LPMQ Isep Misbah (Standar Kemenag RI) */
      @font-face {
        font-family: "LPMQ Isep Misbah";
        src: url("https://cdn.jsdelivr.net/gh/sutanlab/font/LPMQ_IsepMisbah.woff2")
          format("woff2");
        font-display: swap;
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #f8fafc; /* slate-50 */
        /* Dukungan area aman untuk layar HP modern (Notch) */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }

      .font-arabic {
        font-family: "LPMQ Isep Misbah", "Amiri Quran", serif;
        line-height: 2.2; /* Jarak antar baris ekstra untuk harakat Arab */
      }

      /* Menyembunyikan scrollbar untuk tampilan yang lebih bersih */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body
    class="text-slate-800 antialiased overflow-hidden select-none flex justify-center h-screen w-screen"
  >
    <!-- Container Utama: Menyerupai Layar Smartphone -->
    <div
      id="app"
      class="h-full w-full max-w-md bg-slate-50 flex flex-col relative shadow-2xl border-x border-slate-200 overflow-hidden"
    >
      <!-- Header (Bilah Atas) -->
      <header
        class="bg-emerald-600 text-white h-16 flex items-center px-4 shadow-md z-20 relative shrink-0"
      >
        <!-- Tombol Kembali (Disembunyikan secara default) -->
        <button
          id="backBtn"
          onclick="goBack()"
          class="absolute left-3 p-2 rounded-full hover:bg-emerald-700 active:bg-emerald-800 transition-all opacity-0 pointer-events-none transform -translate-x-2"
        >
          <svg
            class="w-6 h-6"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.5"
              d="M15 19l-7-7 7-7"
            ></path>
          </svg>
        </button>

        <!-- Judul Aplikasi / Halaman -->
        <h1
          id="appTitle"
          class="w-full text-center text-lg font-bold tracking-wide transition-all duration-300"
        >
          Panduan Tajwid
        </h1>
      </header>

      <!-- Area Konten Utama -->
      <main
        id="mainContent"
        class="flex-1 overflow-y-auto hide-scrollbar p-5 pb-24 relative bg-slate-50 relative z-10"
      >
        <!-- Konten akan dimuat di sini secara dinamis menggunakan JavaScript -->
      </main>

      <!-- Bottom Navigation -->
      <nav
        class="bg-white border-t border-slate-200 h-16 absolute bottom-0 w-full z-30 flex justify-around items-center px-2 shadow-[0_-4px_15px_-5px_rgba(0,0,0,0.05)]"
      >
        <button
          onclick="switchTab('tajwid')"
          id="tabTajwid"
          class="flex flex-col items-center justify-center w-full h-full text-emerald-600 transition-colors"
        >
          <svg
            class="w-6 h-6 mb-1"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"

            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2.2"
              d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"
            ></path>

          <span class="text-xs font-semibold">Al-Qur'an</span>

    </div>

      // FUNGSI NOTIFIKASI (Pengganti Alert)
      function showToast(message) {
        // Hapus toast sebelumnya jika ada
        document.querySelectorAll(".toast-msg").forEach((t) => t.remove());

        const toast = document.createElement("div");
        toast.className =
          "toast-msg absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-2xl text-sm transition-all duration-300 opacity-0 translate-y-4 z-50 whitespace-nowrap text-center max-w-[90%]";
        toast.textContent = message;
        document.getElementById("app").appendChild(toast);

        // Animasi Masuk
        setTimeout(() => {
          toast.classList.remove("opacity-0", "translate-y-4");
          toast.classList.add("opacity-100", "translate-y-0");
        }, 10);

        // Animasi Keluar
        setTimeout(() => {
          toast.classList.remove("opacity-100", "translate-y-0");
          toast.classList.add("opacity-0", "translate-y-4");
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // FUNGSI NAVIGASI

        navigationStack = [

        ];

        // Update Visualisasi Tab (Warna Aktif/Nonaktif)
        document.getElementById("tabTajwid").className =
          tab === "tajwid"
            ? "flex flex-col items-center justify-center w-full h-full text-emerald-600 transition-colors"
            : "flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 transition-colors";
        document.getElementById("tabQuran").className =
          tab === "quran"
            ? "flex flex-col items-center justify-center w-full h-full text-emerald-600 transition-colors"
            : "flex flex-col items-center justify-center w-full h-full text-slate-400 hover:text-emerald-500 transition-colors";

        renderCurrentState();
      }

      function navigateTo(view, dataId = null) {
        if (view === "home" || view === "quran_list") {
          navigationStack = [{ view: view, dataId: null }];
        } else {
          navigationStack.push({ view: view, dataId: dataId });
        }
        renderCurrentState();
      }

      function goBack() {
        if (navigationStack.length > 1) {
          navigationStack.pop();
          renderCurrentState();
        }
      }

      // PENGELOLA PERUBAHAN LAYAR UTAMA
      function renderCurrentState() {
        const currentState = navigationStack[navigationStack.length - 1];

        // Menghentikan audio tajwid yang sedang diputar ketika pindah layar
        stopAudio();

        // Hapus semua audio Al-Quran yang sedang berjalan
        if (window.currentQuranAudio) {
          window.currentQuranAudio.pause();
          window.currentQuranAudio = null;
          isContinuousPlay = false;
        }

        // Transisi fade out konten
        mainContent.classList.add("opacity-0");

        setTimeout(() => {
          // Atur visibilitas Tombol Kembali
          if (navigationStack.length > 1) {
            backBtn.classList.remove(
              "opacity-0",
              "pointer-events-none",
              "-translate-x-2",
            );
            backBtn.classList.add("opacity-100", "translate-x-0");
          } else {
            backBtn.classList.add(
              "opacity-0",
              "pointer-events-none",
              "-translate-x-2",
            );
            backBtn.classList.remove("opacity-100", "translate-x-0");
          }

          // Render konten berdasarkan jenis view
          if (currentState.view === "home") {
            renderHome();
          } else if (currentState.view === "tajwid_categories") {
            renderTajwidCategories();
          } else if (currentState.view === "category") {
            renderCategory(currentState.dataId);
          } else if (currentState.view === "material") {
            renderMaterial(currentState.dataId);
          } else if (currentState.view === "quran_list") {
            renderQuranList();
          } else if (currentState.view === "quran_surah") {
            renderQuranSurah(currentState.dataId);
          }

          // Gulir ke atas dan transisi fade in
          mainContent.scrollTop = 0;
          mainContent.classList.remove("opacity-0");
          mainContent.classList.add("transition-opacity", "duration-300");
        }, 150); // Waktu jeda agar transisi halus
      }

      async function fetchQuranList() {
        try {
          // Mengambil data dari public API equran.id
          const response = await fetch("https://equran.id/api/v2/surat");
          const data = await response.json();
          return data.data;
        } catch (error) {
          showToast("Gagal memuat data Al-Qur'an. Periksa koneksi internet.");
          return null;
        }
      }

      async function fetchSurahDetail(nomor) {
        try {
          // Mengambil detail ayat spesifik per surah
          const response = await fetch(
            `https://equran.id/api/v2/surat/${nomor}`,
          );
          const data = await response.json();
          return data.data;
        } catch (error) {
          showToast("Gagal memuat surah. Periksa koneksi internet.");
          return null;
        }
      }

      // FUNGSI AUDIO AL-QURAN (Mendukung Putar Per Ayat dan Putar Keseluruhan)

      function toggleContinuousPlay() {
        if (
          isContinuousPlay &&
          window.currentQuranAudio &&
          !window.currentQuranAudio.paused
        ) {
          // 1. Jika sedang dalam mode Putar Surah, maka Pause/Hentikan
          window.currentQuranAudio.pause();
          isContinuousPlay = false;
          updateContinuousBtnUI();
          resetQuranAudioButtons();
        } else if (
          !isContinuousPlay &&
          window.currentQuranAudio &&
          !window.currentQuranAudio.paused
        ) {
          // 2. Jika sedang memutar satu ayat, ubah menjadi mode berlanjut otomatis tanpa jeda (Upgrade Mode)
          isContinuousPlay = true;
          updateContinuousBtnUI();
          showToast("Mode putar berurutan diaktifkan.");
        } else {
          // 3. Mulai memutar Surah (Dari awal, atau melanjutkan ayat yang sedang dijeda)
          isContinuousPlay = true;
          const startIndex = activeAyatIndex !== -1 ? activeAyatIndex : 0;
          playQuranAudio(startIndex, true);
        }
      }

      function updateContinuousBtnUI() {
        const btn = document.getElementById("btnPlaySurah");
        const icon = document.getElementById("iconPlaySurah");
        const text = document.getElementById("textPlaySurah");
        if (!btn) return;

        if (isContinuousPlay) {
          icon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`; // Ikon Pause
          text.textContent = "Hentikan";
          btn.classList.add(
            "bg-white/40",
            "animate-pulse",
            "ring-2",
            "ring-white/50",
          );
        } else {
          icon.innerHTML = `<path d="M8 5v14l11-7z"/>`; // Ikon Play
          text.textContent = "Putar Surah";
          btn.classList.remove(
            "bg-white/40",
            "animate-pulse",
            "ring-2",
            "ring-white/50",
          );
        }
      }

      function resetQuranAudioButtons() {
        const playIcon = `<svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        document.querySelectorAll(".quran-audio-btn").forEach((btn) => {
          btn.innerHTML = playIcon;
          btn.classList.remove(
            "bg-emerald-500",
            "text-white",
            "animate-pulse",
            "border-transparent",
          );
          btn.classList.add(
            "bg-emerald-50",
            "text-emerald-500",
            "border-emerald-100",
          );
        });
        document
          .querySelectorAll('[id^="ayat-container-"]')
          .forEach((container) => {
            container.classList.remove("bg-emerald-50", "border-emerald-200");
            container.classList.add("bg-white", "border-slate-100");
          });
      }

      function playQuranAudio(index, fromContinuous = false) {
        if (!currentSurahAyatData || currentSurahAyatData.length === 0) return;

        // Jika diputar manual lewat tombol ayat (bukan auto-play), matikan mode Putar Berurutan
        if (!fromContinuous) {
          isContinuousPlay = false;
          updateContinuousBtnUI();
        }

        const ayatData = currentSurahAyatData[index];
        const url = ayatData.audio["05"];
        const btnElement = document.getElementById(`btn-audio-ayat-${index}`);
        const containerElement = document.getElementById(
          `ayat-container-${index}`,
        );

        const pauseIcon = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

        // Hentikan suara TTS Tajwid jika ada
        stopAudio();

        // Fitur Pause Manual: Jika mengklik tombol ayat yang sedang berjalan
        if (
          activeAyatIndex === index &&
          window.currentQuranAudio &&
          !window.currentQuranAudio.paused
        ) {
          window.currentQuranAudio.pause();
          isContinuousPlay = false;
          updateContinuousBtnUI();
          resetQuranAudioButtons();
          return;
        }

        // Hentikan audio sebelumnya dan reset semua visual
        if (window.currentQuranAudio) {
          window.currentQuranAudio.pause();
        }
        resetQuranAudioButtons();

        // Tandai ayat yang saat ini aktif
        activeAyatIndex = index;

        // Putar audio MP3 ayat yang dipilih
        window.currentQuranAudio = new Audio(url);
        window.currentQuranAudio.play().catch((e) => {
          showToast(
            "Gagal memutar audio, pastikan Anda terhubung ke internet.",
          );
          isContinuousPlay = false;
          updateContinuousBtnUI();
          resetQuranAudioButtons();
        });

        // Animasi tombol play menjadi warna hijau pekat dan berkedip
        if (btnElement) {
          btnElement.innerHTML = pauseIcon;
          btnElement.classList.remove(
            "bg-emerald-50",
            "text-emerald-500",
            "border-emerald-100",
          );
          btnElement.classList.add(
            "bg-emerald-500",
            "text-white",
            "animate-pulse",
            "border-transparent",
          );

          // Auto Scroll: Gulir layar perlahan mengikuti ayat yang diputar
          setTimeout(() => {
            btnElement.scrollIntoView({ behavior: "smooth", block: "center" });
          }, 150);
        }

        // Highlight kotak ayat yang sedang dibaca
        if (containerElement) {
          containerElement.classList.remove("bg-white", "border-slate-100");
          containerElement.classList.add("bg-emerald-50", "border-emerald-200");
        }

        if (fromContinuous) {
          updateContinuousBtnUI();
        }

        // Logika ketika audio selesai diputar
        window.currentQuranAudio.onended = () => {
          if (isContinuousPlay) {
            const nextIndex = index + 1;
            if (nextIndex < currentSurahAyatData.length) {
              // Putar ayat berikutnya secara otomatis
              playQuranAudio(nextIndex, true);
            } else {
              // Jika sudah mencapai ayat terakhir di surah
              isContinuousPlay = false;
              updateContinuousBtnUI();
              resetQuranAudioButtons();
              activeAyatIndex = -1;
              showToast("Alhamdulillah, pembacaan surah telah selesai.");
            }
          } else {
            // Jika diputar per ayat, kembalikan tampilan tombol ke semula
            resetQuranAudioButtons();
            activeAyatIndex = -1;
          }
        };
      }

                   <div class="bg-emerald-50 text-emerald-900 p-5 rounded-2xl mb-6 text-sm leading-relaxed border border-emerald-100 shadow-sm relative overflow-hidden">
                       <div class="absolute -top-4 -right-4 w-16 h-16 bg-emerald-200/50 rounded-full"></div>
                       <h3 class="font-bold mb-2 flex items-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            Pengertian
                       </h3>
                       ${materi.pengertian}
                   </div>
                   
                   <h3 class="font-bold text-lg text-slate-800 mb-4 px-1">Contoh Bacaan</h3>
                   <div class="space-y-5">
            `;

        materi.contoh.forEach((cth, idx) => {
          // Sanitasi teks arab untuk dioper ke fungsi klik JavaScript
          const safeTeksArab = cth.teks_arab.replace(/'/g, "\\'");

          html += `
                   <div class="bg-white rounded-3xl p-6 shadow-[0_4px_20px_-5px_rgba(0,0,0,0.05)] border border-slate-100 flex flex-col items-center relative overflow-hidden">
                       <!-- Lingkaran Dekoratif Latar Belakang -->
                       <div class="absolute -top-12 -left-12 w-32 h-32 bg-slate-50 rounded-full pointer-events-none"></div>
                       
                       <div class="text-[2.7rem] font-arabic text-emerald-950 leading-relaxed mb-4 text-center mt-2 relative z-10 w-full" dir="rtl">
                           ${cth.teks_arab}
                       </div>
                       
                       <div class="bg-slate-50 px-4 py-1.5 rounded-full text-emerald-700 font-semibold mb-3 text-sm border border-slate-200">
                           ${cth.teks_latin}
                       </div>
                       
                       <div class="text-slate-500 text-sm text-center mb-6 px-2 line-clamp-3">
                           ${cth.penjelasan}
                       </div>
                       
                       <button onclick="toggleAudio(this, '${safeTeksArab}')" class="audio-btn w-14 h-14 bg-emerald-500 rounded-full flex items-center justify-center text-white shadow-[0_8px_15px_-3px_rgba(16,185,129,0.4)] active:scale-[0.85] active:bg-emerald-600 transition-all duration-200 z-10">
                           ${playIcon}
                       </button>
                   </div>
                `;
        });

        html += `</div></div>`;
        mainContent.innerHTML = html;
      }

      // SISTEM AUDIO (Text-To-Speech)
      // Catatan: Karena kita tidak mengunggah file MP3 eksternal, aplikasi ini secara pintar
      // memanfaatkan Web Speech API (Text-to-Speech) untuk membaca Teks Arab secara langsung!

      let currentAudioBtn = null;
      const playIconSVG = `<svg class="w-6 h-6 ml-1" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      const pauseIconSVG = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

      function toggleAudio(btnElement, textArab) {
        // Cek apakah browser mendukung fitur Text-to-Speech
        if (!("speechSynthesis" in window)) {
          showToast("Maaf, HP Anda tidak mendukung pemutaran suara bawaan.");
          return;
        }

        // Jika sedang berbicara (sedang memutar suara)
        if (window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
          resetAllPlayButtons();

          // Jika tombol yang sama ditekan dua kali, cukup hentikan (Pause/Stop)
          if (currentAudioBtn === btnElement) {
            currentAudioBtn = null;
            return;
          }
        }

        // Konfigurasi Suara
        const utterance = new SpeechSynthesisUtterance(textArab);
        utterance.lang = "ar-SA"; // Meminta mesin suara aksen Arab (Saudi Arabia)
        utterance.rate = 0.5; // Memperlambat laju bacaan agar tajwid lebih terdengar
        utterance.pitch = 1.0;

        // Event ketika suara mulai diputar
        utterance.onstart = () => {
          resetAllPlayButtons();
          btnElement.innerHTML = pauseIconSVG;
          btnElement.classList.add("animate-pulse", "bg-emerald-600");
          btnElement.classList.remove("bg-emerald-500");
          currentAudioBtn = btnElement;
        };

        // Event ketika suara selesai
        utterance.onend = () => {
          resetAllPlayButtons();
          currentAudioBtn = null;
        };

        // Event jika terjadi error (misal paket bahasa Arab belum terinstall di HP)
        utterance.onerror = (e) => {
          if (e.error !== "canceled") {
            showToast("Sistem suara Arab belum terpasang di perangkat ini.");
          }
          resetAllPlayButtons();
          currentAudioBtn = null;
        };

        // Putar audio
        window.speechSynthesis.speak(utterance);
      }

      function stopAudio() {
        if ("speechSynthesis" in window && window.speechSynthesis.speaking) {
          window.speechSynthesis.cancel();
        }
        resetAllPlayButtons();
        currentAudioBtn = null;
      }

      function resetAllPlayButtons() {
        const buttons = document.querySelectorAll(".audio-btn");
        buttons.forEach((btn) => {
          btn.innerHTML = playIconSVG;
          btn.classList.remove("animate-pulse", "bg-emerald-600");
          btn.classList.add("bg-emerald-500");
        });
      }

      // FUNGSI PEMUTAR AUDIO UNTUK HURUF HIJAIYAH
      function playHijaiyahAudio(btnElement, textToRead) {
        if (!("speechSynthesis" in window)) {
          showToast("Maaf, HP Anda tidak mendukung pemutaran suara bawaan.");
          return;
        }

        // Hentikan suara lain yang sedang berjalan
        window.speechSynthesis.cancel();

        // Atur gaya tombol yang sedang aktif menjadi warna Emerald mencolok
        document.querySelectorAll('[id^="hijaiyah-btn-"]').forEach((btn) => {
          btn.classList.remove(
            "bg-emerald-500",
            "border-transparent",
            "shadow-md",
            "scale-105",
          );
          btn.classList.add("bg-white", "border-slate-100");
          btn.querySelector("span:first-child").classList.remove("text-white");
          btn
            .querySelector("span:first-child")
            .classList.add("text-emerald-700");
          btn
            .querySelector("span:last-child")
            .classList.remove("text-emerald-100");
          btn.querySelector("span:last-child").classList.add("text-slate-400");
        });

        // Animasi untuk tombol yang ditekan
        btnElement.classList.remove("bg-white", "border-slate-100");
        btnElement.classList.add(
          "bg-emerald-500",
          "border-transparent",
          "shadow-md",
          "scale-105",
        );
        btnElement
          .querySelector("span:first-child")
          .classList.remove("text-emerald-700");
        btnElement
          .querySelector("span:first-child")
          .classList.add("text-white");
        btnElement
          .querySelector("span:last-child")
          .classList.remove("text-slate-400");
        btnElement
          .querySelector("span:last-child")
          .classList.add("text-emerald-100");

        // Konfigurasi Suara (TTS)
        // Menggunakan bahasa Indonesia ('id-ID') membaca Teks Latin agar pasti berfungsi di semua HP/Komputer!
        const utterance = new SpeechSynthesisUtterance(textToRead);
        utterance.lang = "id-ID";
        utterance.rate = 0.8; // Kecepatan normal

        // Kembalikan tampilan tombol seperti semula setelah suara selesai
        const resetBtnStyle = () => {
          btnElement.classList.add("bg-white", "border-slate-100");
          btnElement.classList.remove(
            "bg-emerald-500",
            "border-transparent",
            "shadow-md",
            "scale-105",
          );
          btnElement
            .querySelector("span:first-child")
            .classList.add("text-emerald-700");
          btnElement
            .querySelector("span:first-child")
            .classList.remove("text-white");
          btnElement
            .querySelector("span:last-child")
            .classList.add("text-slate-400");
          btnElement
            .querySelector("span:last-child")
            .classList.remove("text-emerald-100");
        };

        utterance.onend = () => setTimeout(resetBtnStyle, 150);
        utterance.onerror = () => setTimeout(resetBtnStyle, 150);

        window.speechSynthesis.speak(utterance);
      }

      // Inisialisasi saat aplikasi pertama kali dimuat
      window.onload = () => {
        renderHome();
      };
    </script>
  </body>
</html>
